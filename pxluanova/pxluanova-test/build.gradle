plugins {
    id 'java-library'
}

dependencies {
    implementation project(':pxluanova-core')
    implementation project(':pxluanova-jse')
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/lua']
        }
    }
}

test {
    workingDir = file('src/test')

    // Known differences, each with its reason, so that any NEW failure breaks the build.
    // CompatibiltyTest/ErrorsTest compare against reference output captured from C Lua in 2012-2013
    // (lua/luaj3.0-tests.zip). Remove an entry once the difference is fixed.
    filter {
        def compat = 'org.luaj.vm2.CompatibiltyTest$'
        [
            // Depends on the clock and time zone of the machine that produced the reference.
            "${compat}JseCompatibilityTest.testOsLib",
            "${compat}LuaJCCompatibilityTest.testOsLib",
            // table.insert(t, 10, v) on an 8-element table: we raise "position out of bounds" like Lua 5.2.2+;
            // the reference was produced by an older Lua that allowed it.
            "${compat}JseCompatibilityTest.testTableLib",
            "${compat}LuaJCCompatibilityTest.testTableLib",
            // Numbers are formatted by Java (1.7340252117279783E41), not Lua's "%.14g" (1.734025211728e+41).
            "${compat}JseCompatibilityTest.testManyUpvals",
            "${compat}LuaJCCompatibilityTest.testManyUpvals",
            // Reference predates yieldable pcall/nested resume and expects "attempt to yield across
            // metamethod/C-call boundary" where Lua 5.2 (and we) succeed. Covered by CoroutineYieldTest.
            "${compat}JseCompatibilityTest.testCoroutineLib",
            // debug.getlocal/setlocal on frames of the frame interpreter differ from the reference.
            "${compat}JseCompatibilityTest.testDebugLib",
            // LuaJC-compiled code has no interpreter frames: it cannot yield, cannot be string.dump'ed,
            // and does not run the xpcall message handler.
            "${compat}LuaJCCompatibilityTest.testCoroutineLib",
            "${compat}LuaJCCompatibilityTest.testStringLib",
            "${compat}LuaJCCompatibilityTest.testBaseLib",
            // Error message wording and Lua 5.1-only APIs (package.seeall, math.atan2 arity, ...).
            'org.luaj.vm2.ErrorsTest.testBaseLibArgs',
            'org.luaj.vm2.ErrorsTest.testDebugLibArgs',
            'org.luaj.vm2.ErrorsTest.testIoLibArgs',
            'org.luaj.vm2.ErrorsTest.testMathLibArgs',
            'org.luaj.vm2.ErrorsTest.testModuleLibArgs',
            'org.luaj.vm2.ErrorsTest.testStringLibArgs',
        ].each { excludeTestsMatching it }
    }
}