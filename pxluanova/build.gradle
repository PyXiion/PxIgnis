plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.pxluanova'
version = '3.1.0'

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    // Keep the bytecode at Java 21 whichever JDK runs Gradle: PxIgnis consumes this build from
    // both its 1.21.x (Java 21) and 26.x (Java 25) targets.
    pluginManager.withPlugin('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 21
        }
    }
}