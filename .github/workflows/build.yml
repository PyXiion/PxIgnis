name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Any base branch, so stacked PRs (PR into another PR's branch) get CI too.
  pull_request:
  workflow_dispatch:

jobs:
  pxluanova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Test PxLuaNova
        working-directory: pxluanova
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pxluanova-test-reports
          path: |
            pxluanova/pxluanova-test/build/reports/tests/
            pxluanova/pxluanova-test/build/test-results/

  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.2 and lua-language-server
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.2
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL https://github.com/LuaLS/lua-language-server/releases/download/3.13.9/lua-language-server-3.13.9-linux-x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/luals"

      - name: Check the arena tutorial
        run: LUALS="$RUNNER_TEMP/luals/bin/lua-language-server" site/tutorial/test.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.11", "26.3"]
    steps:
      - uses: actions/checkout@v7

      # Gradle runs on JDK 25 for every target; the toolchain compiles 1.21.x for Java 21.
      - name: Set up JDK 25 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build for ${{ matrix.version }}
        run: ./gradlew build --no-daemon -PtargetVersion=${{ matrix.version }}

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.version }}
          path: |
            build/*/reports/tests/
            build/*/test-results/
            plugins/*/build/*/reports/tests/
            plugins/*/build/*/test-results/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.version }}
          path: build/libs/PxIgnis-*-fabric-*.jar
          if-no-files-found: error

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jar-voice-${{ matrix.version }}
          path: plugins/voice/build/libs/ignis-voice-*-fabric-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pxluanova, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: jar-*
          merge-multiple: true

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            /^## / { on = 0 }
            on
          ' site/src/content/docs/changelog.md | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::no '## $version' section in site/src/content/docs/changelog.md" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PxIgnis-*.jar
            dist/ignis-voice-*.jar
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Publish 1.21.11 to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: SYYlZZEi
          modrinth-token: ${{ secrets.MODRINTH }}
          files: dist/PxIgnis-*1.21.11*.jar
          game-versions: 1.21.11
          loaders: fabric
          version-type: release
          modrinth-unfeature-mode: none
          dependencies: |
            fabric-api
            fabric-language-kotlin

      - name: Publish 26.3 to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: SYYlZZEi
          modrinth-token: ${{ secrets.MODRINTH }}
          files: dist/PxIgnis-*26.3*.jar
          game-versions: 26.3
          loaders: fabric
          version-type: release
          modrinth-unfeature-mode: none
          dependencies: |
            fabric-api
            fabric-language-kotlin
