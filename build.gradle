buildscript {
    ext.kotlin_version = '2.2.21'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
plugins {
    // Both Loom flavours ship in the same artifact; the one that matches the target
    // Minecraft version (obfuscated 1.21.x vs. unobfuscated 26.x) is applied below.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'maven-publish'

    id 'com.gradleup.shadow' version '9.4.1'
}

def buildTarget = project.findProperty('targetVersion')
def versionFile = file("gradle/versions/${buildTarget}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Unknown targetVersion '${buildTarget}'. Available: " +
            file('gradle/versions').listFiles().collect { it.name - '.properties' }.sort().join(', '))
}
def targetProps = new Properties()
versionFile.withInputStream { targetProps.load(it) }
targetProps.each { k, v -> project.ext.set(k as String, v as String) }

def obfuscated = project.obfuscated.toBoolean()
def targetJavaVersion = project.java_version.toInteger()

apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
apply plugin: 'kotlin'
apply plugin: 'com.gradleup.shadow'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/version-${buildTarget}/resources/pxignis.accesswidener")

    splitEnvironmentSourceSets()

    mods {
        "pxignis" {
            sourceSet sourceSets.main
        }
        "pxignis" {
            sourceSet sourceSets.client
        }
    }

    log4jConfigs.from "log4j-dev.xml"
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
    }
    // Unobfuscated (26.x) Loom has no mod* configurations: plain `implementation` is enough.
    def modImpl = obfuscated ? 'modImplementation' : 'implementation'
    add(modImpl, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modImpl, "net.fabricmc:fabric-language-kotlin:1.13.11+kotlin.2.3.21")

    add(modImpl, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // поддержка LUA (PxLuaNova)
    implementation "com.pxluanova:pxluanova-core:3.1.0"
    shadow "com.pxluanova:pxluanova-core:3.1.0"
    implementation "com.pxluanova:pxluanova-jse:3.1.0"
    // Minecraft already ships commons-lang3; BCEL only pulls it in transitively,
    // so don't shadow a conflicting copy.
    shadow ("com.pxluanova:pxluanova-jse:3.1.0") {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // Permissions API
    add(modImpl, "me.lucko:fabric-permissions-api:${project.permissions_api_version}")
    shadow ("me.lucko:fabric-permissions-api:${project.permissions_api_version}") {
        transitive = false
    }

    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:$kotlin_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

shadowJar {
    configurations = [project.configurations.shadow]
    from sourceSets.main.output
    from sourceSets.client.output

    relocate 'org.luaj', 'ru.pyxiion.luanova'
    relocate 'me.lucko.fabric.api.permissions', 'ru.pyxiion.lib.fabric.api.permissions'
}

if (obfuscated) {
    remapJar {
        dependsOn shadowJar
        inputFile.set shadowJar.archiveFile
        archiveBaseName.set "PxIgnis"
        archiveVersion.set "${project.version}-fabric-${buildTarget}"
        archiveClassifier.set null
    }
} else {
    // No remapping on 26.x: the shaded jar is the release artifact.
    jar {
        archiveClassifier.set 'slim'
    }
    shadowJar {
        archiveBaseName.set "PxIgnis"
        archiveVersion.set "${project.version}-fabric-${buildTarget}"
        archiveClassifier.set null
    }
    tasks.named('assemble') {
        dependsOn shadowJar
    }
}

sourceSets {
    main {
        kotlin.srcDirs = ["src/version-${buildTarget}/kotlin", "src/main/java"]
        resources.srcDirs += "src/version-${buildTarget}/resources"
    }
    client {
        kotlin.srcDirs = ["src/version-${buildTarget}/client-kotlin", "src/client/java"]
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
kotlin {
    jvmToolchain(targetJavaVersion)
}
